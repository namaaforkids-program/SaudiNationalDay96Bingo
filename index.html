        /* =====================================================
           WIN CONDITIONS
           ===================================================== */

        function checkWinConditions() {

            const board =
                getFullBoardElements();


            const matrix1 = [];

            const matrix2 = [];


            for (
                let row = 0;
                row < 5;
                row++
            ) {

                const row1 = [];

                const row2 = [];


                for (
                    let col = 0;
                    col < 5;
                    col++
                ) {

                    const element =
                        board[
                            row * 5 + col
                        ];


                    row1.push(

                        element.isFree

                        ?

                        true

                        :

                        !!gameState.team1Checked[
                            element.id
                        ]

                    );


                    row2.push(

                        element.isFree

                        ?

                        true

                        :

                        !!gameState.team2Checked[
                            element.id
                        ]

                    );

                }


                matrix1.push(
                    row1
                );


                matrix2.push(
                    row2
                );

            }



            if (
                !gameState.hasTeam1Won &&
                hasCompletedLine(matrix1)
            ) {

                gameState.hasTeam1Won =
                    true;


                showWinModal(
                    gameState.team1Name
                );

            }


            else if (
                !gameState.hasTeam2Won &&
                hasCompletedLine(matrix2)
            ) {

                gameState.hasTeam2Won =
                    true;


                showWinModal(
                    gameState.team2Name
                );

            }

        }



        /* =====================================================
           LINE CHECK
           ===================================================== */

        function hasCompletedLine(
            matrix
        ) {


            /* ROWS */

            for (
                let row = 0;
                row < 5;
                row++
            ) {

                if (
                    matrix[row].every(
                        value => value
                    )
                ) {

                    return true;

                }

            }



            /* COLUMNS */

            for (
                let col = 0;
                col < 5;
                col++
            ) {

                let completed =
                    true;


                for (
                    let row = 0;
                    row < 5;
                    row++
                ) {

                    if (
                        !matrix[row][col]
                    ) {

                        completed =
                            false;

                        break;

                    }

                }


                if (completed) {

                    return true;

                }

            }



            /* MAIN DIAGONAL */

            let diagonal1 =
                true;


            for (
                let i = 0;
                i < 5;
                i++
            ) {

                if (
                    !matrix[i][i]
                ) {

                    diagonal1 =
                        false;

                    break;

                }

            }


            if (diagonal1) {

                return true;

            }



            /* REVERSE DIAGONAL */

            let diagonal2 =
                true;


            for (
                let i = 0;
                i < 5;
                i++
            ) {

                if (
                    !matrix[i][4 - i]
                ) {

                    diagonal2 =
                        false;

                    break;

                }

            }


            if (diagonal2) {

                return true;

            }


            return false;

        }

        function drawNextElement() {

            const available =
                RAW_BINGO_ELEMENTS.filter(
                    element =>

                        !gameState.drawnElements.some(
                            drawn =>
                                drawn.id ===
                                element.id
                        )

                );


            if (
                available.length === 0
            ) {

                document.getElementById(
                    'card-name'
                ).innerText =
                    'انتهت العناصر';


                const button =
                    document.getElementById(
                        'btn-draw-element'
                    );


                button.disabled =
                    true;


                return;

            }


            const element =
                available[
                    Math.floor(
                        Math.random() *
                        available.length
                    )
                ];


            gameState.drawnElements.push(
                element
            );


            gameState.currentElement =
                element;


            updateElementDisplay();

            updateElementHistory();

        }

                    'question-text'
                ).innerText =
                    'تم سحب جميع الأسئلة الـ50!';


                const button =
                    document.getElementById(
                        'btn-draw-question'
                    );


                button.disabled =
                    true;


                return;

            }


            const question =
                available[
                    Math.floor(
                        Math.random() *
                        available.length
                    )
                ];


            gameState.drawnQuestions.push(
                question
            );


            gameState.currentQuestion =
                question;


            updateQuestionDisplay();

            updateQuestionHistory();

        }



        /* =====================================================
           QUESTION DISPLAY
           ===================================================== */

        function updateQuestionDisplay() {

            const question =
                gameState.currentQuestion;


            if (!question) {

                return;

            }


            const questionText =
                document.getElementById(
                    'question-text'
                );


            const answerText =
                document.getElementById(
                    'answer-text'
                );


            const answerBox =
                document.getElementById(
                    'answer-box'
                );


            const revealButton =
                document.getElementById(
                    'btn-reveal'
                );


            questionText.innerText =
                question.q;


            answerText.innerText =
                question.a;


            /* RESET ANSWER */

            answerBox.classList.add(
                'blur-sm',
                'opacity-50'
            );


            revealButton.style.display =
                'flex';


            revealButton.style.opacity =
                '1';


            revealButton.disabled =
                false;

        }



        /* =====================================================
           REVEAL ANSWER
           ===================================================== */

        function revealAnswer() {

            const answerBox =
                document.getElementById(
                    'answer-box'
                );


            const button =
                document.getElementById(
                    'btn-reveal'
                );


            answerBox.classList.remove(
                'blur-sm',
                'opacity-50'
            );


            button.style.opacity =
                '0';


            button.disabled =
                true;


            setTimeout(
                () => {

                    button.style.display =
                        'none';

                },
                300
            );

        }



        /* =====================================================
           ELEMENT HISTORY
           ===================================================== */

        function updateElementHistory() {

            const container =
                document.getElementById(
                    'element-history'
                );


            if (
                gameState.drawnElements.length ===
                1
            ) {

                container.innerHTML =
                    '';

            }


            const current =
                gameState.drawnElements[
                    gameState.drawnElements.length - 1
                ];


            const item =
                document.createElement(
                    'span'
                );


            item.className =
                `
                bg-saudi-green/30
                text-white
                px-1.5
                py-0.5
                rounded-xl
                text-[7px]
                font-bold
                border
                border-saudi-green/50
                `;


            item.innerHTML =
                `

                <i
                    class="
                        fa-solid
                        ${current.icon}
                        text-saudi-gold
                        ml-1
                    "
                ></i>

                ${current.name}

                `;


            container.insertBefore(
                item,
                container.firstChild
            );

        }



        /* =====================================================
           QUESTION HISTORY
           ===================================================== */

        function updateQuestionHistory() {

            const container =
                document.getElementById(
                    'question-history'
                );


            if (
                gameState.drawnQuestions.length ===
                1
            ) {

                container.innerHTML =
                    '';

            }


            const current =
                gameState.drawnQuestions[
                    gameState.drawnQuestions.length - 1
                ];


            const item =
                document.createElement(
                    'span'
                );


            item.className =
                `
                bg-saudi-gold/20
                text-white
                px-1.5
                py-0.5
                rounded-xl
                text-[7px]
                font-bold
                border
                border-saudi-gold/40
                `;


            item.innerHTML =
                `

                <i
                    class="
                        fa-solid
                        fa-circle-question
                        text-saudi-gold
                        ml-1
                    "
                ></i>

                سؤال ${current.id}

                `;


            container.insertBefore(
                item,
                container.firstChild
            );

        }



        /* =====================================================
           INITIALIZE
           ===================================================== */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                renderTeamBoards();

            }
        );

    </script>

</body>

</html>
