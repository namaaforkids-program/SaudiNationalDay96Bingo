<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لعبة بنقو اليوم الوطني 96</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    },
                    colors: {
                        saudi: {
                            green: '#006C35',
                            dark: '#003B1D',
                            gold: '#D4AF37',
                            cream: '#F8F5E9'
                        }
                    }
                }
            }
        };
    </script>


    <style>

        /* =========================================
           BASIC
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0,108,53,.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(212,175,55,.08),
                    transparent 35%
                ),
                #002d16;

            color: white;

            overflow: hidden;
        }


        /* =========================================
           APP LAYOUT
        ========================================= */

        .app {
            width: 100vw;
            height: 100vh;

            display: grid;

            grid-template-rows:
                9vh
                18vh
                1fr
                10vh;

            overflow: hidden;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                1vh
                3vw;

            background:
                rgba(0, 45, 22, .95);

            border-bottom:
                1px solid
                rgba(212,175,55,.35);

            min-height: 0;
        }


        .game-title {
            display: flex;

            align-items: center;

            gap: 10px;

            font-size:
                clamp(
                    16px,
                    1.8vw,
                    28px
                );

            font-weight: 900;

            white-space: nowrap;
        }


        .title-dot {
            width: 10px;
            height: 10px;

            background:
                #D4AF37;

            border-radius: 50%;

            box-shadow:
                0 0 12px
                rgba(212,175,55,.7);
        }


        .logo-container {
            width:
                clamp(
                    45px,
                    6vh,
                    65px
                );

            height:
                clamp(
                    45px,
                    6vh,
                    65px
                );

            background: white;

            border:
                2px solid
                #D4AF37;

            border-radius: 50%;

            padding: 3px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            box-shadow:
                0 0 18px
                rgba(212,175,55,.3);

            flex-shrink: 0;
        }


        .logo-container img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            border-radius: 50%;
        }


        /* =========================================
           QUESTION AREA
        ========================================= */

        .question-area {
            min-height: 0;

            padding:
                1vh
                3vw;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: .7vh;
        }


        .question-label {
            color:
                #D4AF37;

            font-size:
                clamp(
                    10px,
                    1vw,
                    16px
                );

            font-weight: 900;
        }


        .question-box {
            width: 100%;

            max-width: 1100px;

            min-height: 0;

            padding:
                1vh
                2vw;

            background:
                rgba(0,0,0,.22);

            border:
                1px solid
                rgba(212,175,55,.3);

            border-radius: 14px;

            text-align: center;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        #question-text {
            margin: 0;

            font-size:
                clamp(
                    12px,
                    1.35vw,
                    21px
                );

            line-height: 1.45;

            font-weight: 800;

            color: white;
        }


        /* =========================================
           GAME AREA
        ========================================= */

        .game-area {
            min-height: 0;

            padding:
                .8vh
                2vw;

            display: flex;

            flex-direction: column;

            gap: .8vh;

            overflow: hidden;
        }


        /* =========================================
           CURRENT ELEMENT
        ========================================= */

        .element-area {
            flex-shrink: 0;

            height:
                9vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .element-card {
            height: 100%;

            min-width:
                220px;

            padding:
                .5vh
                2vw;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f3f0df
                );

            border:
                2px solid
                #D4AF37;

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            color:
                #003B1D;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.3);
        }


        .element-icon {
            width:
                45px;

            height:
                45px;

            border-radius:
                12px;

            background:
                #006C35;

            color:
                #D4AF37;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                22px;

            flex-shrink:
                0;
        }


        .element-info {
            text-align: center;
        }


        .element-label {
            display: block;

            font-size:
                9px;

            color:
                #666;

            font-weight:
                700;
        }


        #card-name {
            display: block;

            font-size:
                clamp(
                    14px,
                    1.4vw,
                    22px
                );

            font-weight:
                900;

            white-space:
                nowrap;
        }


        /* =========================================
           TEAMS
        ========================================= */

        .teams {
            min-height: 0;

            flex: 1;

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap:
                1.2vw;
        }


        .team {
            min-width: 0;

            min-height: 0;

            background:
                rgba(0,59,29,.78);

            border:
                1px solid
                rgba(212,175,55,.35);

            border-radius:
                16px;

            padding:
                .8vh
                .8vw;

            display:
                flex;

            flex-direction:
                column;

            overflow:
                hidden;
        }


        .team-header {
            height:
                4vh;

            min-height:
                30px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            padding:
                0
                .5vw;

            flex-shrink:
                0;

            border-bottom:
                1px solid
                rgba(212,175,55,.2);
        }


        .team-name {
            width:
                55%;

            min-width:
                0;

            background:
                transparent;

            border:
                none;

            border-bottom:
                1px dashed
                rgba(212,175,55,.5);

            outline:
                none;

            color:
                #D4AF37;

            font-family:
                'Cairo',
                sans-serif;

            font-size:
                clamp(
                    11px,
                    1.15vw,
                    18px
                );

            font-weight:
                900;

            text-align:
                right;
        }


        .score {
            background:
                #006C35;

            color:
                white;

            padding:
                2px 10px;

            border-radius:
                999px;

            font-size:
                clamp(
                    8px,
                    .7vw,
                    12px
                );

            font-weight:
                800;

            white-space:
                nowrap;
        }


        /* =========================================
           BINGO BOARD
        ========================================= */

        .bingo-grid {
            flex:
                1;

            min-height:
                0;

            display:
                grid;

            grid-template-columns:
                repeat(5, 1fr);

            grid-template-rows:
                repeat(5, 1fr);

            gap:
                clamp(
                    3px,
                    .35vw,
                    7px
                );

            padding-top:
                .7vh;
        }


        .bingo-cell {
            min-width:
                0;

            min-height:
                0;

            width:
                100%;

            height:
                100%;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius:
                clamp(
                    5px,
                    .6vw,
                    10px
                );

            background:
                rgba(0,0,0,.22);

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            gap:
                2px;

            cursor:
                pointer;

            overflow:
                hidden;

            transition:
                .18s ease;
        }


        .bingo-cell:hover {
            background:
                rgba(212,175,55,.15);

            border-color:
                rgba(212,175,55,.7);

            transform:
                scale(1.025);
        }


        .bingo-cell.checked {
            background:
                linear-gradient(
                    135deg,
                    #087b42,
                    #00552b
                );

            border:
                2px solid
                #D4AF37;

            box-shadow:
                0 0 10px
                rgba(212,175,55,.2);
        }


        .bingo-cell.free {
            background:
                linear-gradient(
                    135deg,
                    #D4AF37,
                    #b99324
                );

            color:
                #003B1D;

            border:
                2px solid
                #f5dc79;
        }


        .bingo-cell i {
            font-size:
                clamp(
                    9px,
                    1.1vw,
                    17px
                );

            color:
                #D4AF37;
        }


        .bingo-cell.checked i {
            color:
                white;
        }


        .bingo-cell.free i {
            color:
                #003B1D;
        }


        .bingo-cell span {
            font-size:
                clamp(
                    6px,
                    .72vw,
                    11px
                );

            font-weight:
                800;

            line-height:
                1.15;

            padding:
                0 2px;
        }


        /* =========================================
           BOTTOM
        ========================================= */

        .bottom-area {
            min-height:
                0;

            padding:
                .8vh
                3vw;

            background:
                rgba(0,45,22,.96);

            border-top:
                1px solid
                rgba(212,175,55,.25);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                12px;

            position:
                relative;

            z-index:
                20;
        }


        .game-button {
            min-width:
                180px;

            height:
                6vh;

            min-height:
                38px;

            border:
                2px solid
                #D4AF37;

            border-radius:
                999px;

            padding:
                0 25px;

            font-family:
                'Cairo',
                sans-serif;

            font-size:
                clamp(
                    10px,
                    1vw,
                    16px
                );

            font-weight:
                900;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            transition:
                .2s ease;

            position:
                relative;

            z-index:
                30;
        }


        .element-button {
            background:
                #006C35;

            color:
                white;
        }


        .question-button {
            background:
                #D4AF37;

            color:
                #003B1D;
        }


        .game-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 6px 18px
                rgba(212,175,55,.3);
        }


        .game-button:active {
            transform:
                translateY(0);
        }


        .game-button:disabled {
            opacity:
                .45;

            cursor:
                not-allowed;

            transform:
                none;
        }


        /* =========================================
           ANSWER
        ========================================= */

        .answer-container {
            position:
                fixed;

            top:
                9vh;

            left:
                50%;

            transform:
                translateX(-50%);

            width:
                min(90vw, 900px);

            z-index:
                50;

            display:
                none;
        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {
            position:
                fixed;

            inset:
                0;

            background:
                rgba(0,0,0,.78);

            backdrop-filter:
                blur(6px);

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            z-index:
                100;

            padding:
                20px;
        }


        .modal.show {
            display:
                flex;
        }


        .modal-content {
            background:
                #003B1D;

            border:
                3px solid
                #D4AF37;

            border-radius:
                24px;

            padding:
                30px;

            width:
                min(90vw, 450px);

            text-align:
                center;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.5);
        }


        /* =========================================
           SMALL HEIGHT SCREENS
        ========================================= */

        @media (max-height: 650px) {

            .app {
                grid-template-rows:
                    8vh
                    16vh
                    1fr
                    11vh;
            }

            .element-area {
                height:
                    7vh;
            }

            .element-icon {
                width:
                    32px;

                height:
                    32px;

                font-size:
                    15px;
            }

            .team-header {
                height:
                    3.5vh;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .app {
                grid-template-rows:
                    8vh
                    19vh
                    1fr
                    11vh;
            }


            .header {
                padding:
                    1vh
                    3vw;
            }


            .teams {
                gap:
                    5px;
            }


            .team {
                padding:
                    4px;
            }


            .bingo-grid {
                gap:
                    3px;
            }


            .bingo-cell span {
                font-size:
                    5px;
            }


            .bingo-cell i {
                font-size:
                    8px;
            }


            .game-button {
                min-width:
                    0;

                width:
                    42vw;

                padding:
                    0 8px;
            }


            .element-card {
                min-width:
                    170px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">


        <!-- GAME TITLE - RIGHT -->

        <div class="game-title">

            <span class="title-dot"></span>

            <span>
                لعبة بنقو اليوم الوطني 96
            </span>

        </div>


        <!-- LOGO - LEFT -->

        <div class="logo-container">

            <img
                src="./74C4E3DD-B884-454B-B50B-6663DD3B846E.png"
                alt="شعار نماء"
                id="store-logo-img"
            >

        </div>

    </header>



    <!-- =========================================
         QUESTION
    ========================================== -->

    <section class="question-area">


        <div class="question-label">

            <i class="fa-solid fa-circle-question"></i>

            السؤال الثقافي

        </div>


        <div class="question-box">

            <p id="question-text">

                اضغط على "سحب سؤال" لبدء المسابقة

            </p>

        </div>


        <!-- ANSWER BUTTON -->

        <button
            id="btn-reveal"
            onclick="revealAnswer()"
            disabled
            style="
                border:none;
                background:transparent;
                color:#D4AF37;
                font-family:Cairo;
                font-weight:800;
                font-size:10px;
                cursor:pointer;
            "
        >

            <i class="fa-solid fa-eye"></i>

            إظهار الإجابة

        </button>


        <div
            id="answer-text"
            style="
                display:none;
                font-size:11px;
                font-weight:800;
                text-align:center;
                color:#D4AF37;
            "
        ></div>

    </section>



    <!-- =========================================
         GAME AREA
    ========================================== -->

    <main class="game-area">


        <!-- CURRENT ELEMENT -->

        <div class="element-area">

            <div
                id="current-card-display"
                class="element-card"
            >

                <div
                    id="card-icon"
                    class="element-icon"
                >

                    <i class="fa-solid fa-dice"></i>

                </div>


                <div class="element-info">

                    <span class="element-label">
                        العنصر المسحوب
                    </span>

                    <span id="card-name">
                        في الانتظار
                    </span>

                </div>

            </div>

        </div>



        <!-- TEAMS -->

        <div class="teams">


            <!-- TEAM 1 -->

            <section class="team">


                <div class="team-header">

                    <input
                        id="team1-name-input"
                        class="team-name"
                        value="فريق الأخضر"
                        onchange="updateTeamName(1)"
                    >


                    <span
                        id="team1-score"
                        class="score"
                    >
                        1 / 25
                    </span>

                </div>


                <div
                    id="team1-grid"
                    class="bingo-grid"
                ></div>

            </section>



            <!-- TEAM 2 -->

            <section class="team">


                <div class="team-header">

                    <input
                        id="team2-name-input"
                        class="team-name"
                        value="فريق المجد"
                        onchange="updateTeamName(2)"
                    >


                    <span
                        id="team2-score"
                        class="score"
                    >
                        1 / 25
                    </span>

                </div>


                <div
                    id="team2-grid"
                    class="bingo-grid"
                ></div>

            </section>

        </div>

    </main>



    <!-- =========================================
         BOTTOM BUTTONS
    ========================================== -->

    <footer class="bottom-area">


        <button
            id="btn-draw-question"
            class="
                game-button
                question-button
            "
            onclick="drawNextQuestion()"
        >

            <i class="fa-solid fa-circle-question"></i>

            سحب سؤال

        </button>



        <button
            id="btn-draw-element"
            class="
                game-button
                element-button
            "
            onclick="drawNextElement()"
        >

            <i class="fa-solid fa-dice"></i>

            سحب عنصر

        </button>

    </footer>

</div>



<!-- =========================================
     WIN MODAL
========================================== -->

<div
    id="win-modal"
    class="modal"
>

    <div class="modal-content">

        <div
            style="
                font-size:55px;
                color:#D4AF37;
                margin-bottom:10px;
            "
        >

            <i class="fa-solid fa-trophy"></i>

        </div>


        <h2
            id="win-title"
            style="
                color:#D4AF37;
                font-size:24px;
                font-weight:900;
                margin:0 0 10px;
            "
        >

            مبروك الفوز!

        </h2>


        <p
            id="win-message"
            style="
                color:white;
                font-size:14px;
                font-weight:700;
                margin-bottom:20px;
            "
        >

            استطاع الفريق إكمال خط مستقيم!

        </p>


        <button
            onclick="closeWinModal()"
            class="game-button element-button"
            style="margin:auto;"
        >

            استمرار اللعب

        </button>

    </div>

</div>

/* =====================================================
   STATE
===================================================== */

const gameState = {

    team1Name: 'فريق الأخضر',

    team2Name: 'فريق المجد',

    drawnElements: [],

    drawnQuestions: [],

    currentElement: null,

    currentQuestion: null,

    team1Checked: {
        free: true
    },

    team2Checked: {
        free: true
    },

    team1Won: false,

    team2Won: false

};



/* =====================================================
   BOARD
===================================================== */

function getBoard() {

    const board = [
        ...RAW_BINGO_ELEMENTS
    ];

    board.splice(
        12,
        0,
        {
            id: 'free',
            name: 'FREE',
            icon: 'fa-star',
            isFree: true
        }
    );

    return board;
}



/* =====================================================
   TEAM NAME
===================================================== */

function updateTeamName(team) {

    if (team === 1) {

        const value =
            document
            .getElementById(
                'team1-name-input'
            )
            .value
            .trim();

        gameState.team1Name =
            value ||
            'فريق الأخضر';

    }

    else {

        const value =
            document
            .getElementById(
                'team2-name-input'
            )
            .value
            .trim();

        gameState.team2Name =
            value ||
            'فريق المجد';

    }

}



/* =====================================================
   RENDER
===================================================== */

function renderTeamBoards() {

    renderTeam(
        1,
        'team1-grid',
        gameState.team1Checked
    );

    renderTeam(
        2,
        'team2-grid',
        gameState.team2Checked
    );


    updateScores();

    checkWins();

}



/* =====================================================
   RENDER TEAM
===================================================== */

function renderTeam(
    teamNumber,
    gridId,
    checkedMap
) {

    const grid =
        document.getElementById(
            gridId
        );

    grid.innerHTML = '';


    getBoard().forEach(
        element => {

            const checked =
                !!checkedMap[
                    element.id
                ];


            const cell =
                document.createElement(
                    'div'
                );


            cell.className =
                'bingo-cell';


            if (element.isFree) {

                cell.classList.add(
                    'free'
                );

            }

            else if (checked) {

                cell.classList.add(
                    'checked'
                );

            }


            cell.innerHTML = `

                <i class="
                    fa-solid
                    ${element.icon}
                "></i>

                <span>
                    ${element.name}
                </span>

            `;


            if (
                !element.isFree
            ) {

                cell.addEventListener(
                    'click',
                    () => {

                        toggleCell(
                            teamNumber,
                            element.id
                        );

                    }
                );

            }


            grid.appendChild(
                cell
            );

        }
    );

}



/* =====================================================
   TOGGLE
===================================================== */

function toggleCell(
    team,
    id
) {

    if (team === 1) {

        gameState.team1Checked[id] =
            !gameState.team1Checked[id];

    }

    else {

        gameState.team2Checked[id] =
            !gameState.team2Checked[id];

    }


    renderTeamBoards();

}



/* =====================================================
   SCORES
===================================================== */

function updateScores() {

    const score1 =
        Object.values(
            gameState.team1Checked
        )
        .filter(Boolean)
        .length;


    const score2 =
        Object.values(
            gameState.team2Checked
        )
        .filter(Boolean)
        .length;


    document.getElementById(
        'team1-score'
    ).innerText =
        `${score1} / 25`;


    document.getElementById(
        'team2-score'
    ).innerText =
        `${score2} / 25`;

}



/* =====================================================
   WIN CHECK
===================================================== */

function checkWins() {

    if (
        !gameState.team1Won &&
        checkBoard(
            gameState.team1Checked
        )
    ) {

        gameState.team1Won =
            true;

        showWin(
            gameState.team1Name
        );

    }


    if (
        !gameState.team2Won &&
        checkBoard(
            gameState.team2Checked
        )
    ) {

        gameState.team2Won =
            true;

        showWin(
            gameState.team2Name
        );

    }

}



/* =====================================================
   CHECK BOARD
===================================================== */

function checkBoard(
    checked
) {

    const board =
        getBoard();


    const matrix = [];


    for (
        let r = 0;
        r < 5;
        r++
    ) {

        const row = [];


        for (
            let c = 0;
            c < 5;
            c++
        ) {

            const element =
                board[
                    r * 5 + c
                ];


            row.push(
                element.isFree ||
                !!checked[
                    element.id
                ]
            );

        }


        matrix.push(
            row
        );

    }


    /* ROWS */

    for (
        let r = 0;
        r < 5;
        r++
    ) {

        if (
            matrix[r].every(
                Boolean
            )
        ) {

            return true;

        }

    }


    /* COLUMNS */

    for (
        let c = 0;
        c < 5;
        c++
    ) {

        let complete =
            true;


        for (
            let r = 0;
            r < 5;
            r++
        ) {

            if (
                !matrix[r][c]
            ) {

                complete =
                    false;

                break;

            }

        }


        if (complete) {

            return true;

        }

    }


    /* DIAGONAL */

    let diagonal =
        true;


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        if (
            !matrix[i][i]
        ) {

            diagonal =
                false;

            break;

        }

    }


    if (diagonal) {

        return true;

    }


    /* REVERSE DIAGONAL */

    diagonal =
        true;


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        if (
            !matrix[i][4-i]
        ) {

            diagonal =
                false;

            break;

        }

    }


    return diagonal;

}



/* =====================================================
   DRAW ELEMENT
===================================================== */

function drawNextElement() {

    const available =
        RAW_BINGO_ELEMENTS.filter(
            element =>

                !gameState
                .drawnElements
                .some(
                    drawn =>
                        drawn.id ===
                        element.id
                )
        );


    if (
        available.length === 0
    ) {

        document.getElementById(
            'card-name'
        ).innerText =
            'انتهت العناصر';


        document.getElementById(
            'btn-draw-element'
        ).disabled =
            true;

        return;

    }


    const element =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    gameState
        .drawnElements
        .push(
            element
        );


    gameState.currentElement =
        element;


    const icon =
        document.getElementById(
            'card-icon'
        );


    const name =
        document.getElementById(
            'card-name'
        );


    icon.innerHTML =
        `<i class="fa-solid ${element.icon}"></i>`;


    name.innerText =
        element.name;


    document
        .getElementById(
            'current-card-display'
        )
        .animate(
            [
                {
                    transform:
                        'scale(.8)',
                    opacity:
                        .4
                },
                {
                    transform:
                        'scale(1)',
                    opacity:
                        1
                }
            ],
            {
                duration:
                    350
            }
        );

}



/* =====================================================
   DRAW QUESTION
===================================================== */

function drawNextQuestion() {

    const available =
        QUESTIONS_BANK.filter(
            question =>

                !gameState
                .drawnQuestions
                .some(
                    drawn =>
                        drawn.id ===
                        question.id
                )
        );


    if (
        available.length === 0
    ) {

        document.getElementById(
            'question-text'
        ).innerText =
            'تم سحب جميع الأسئلة!';


        document.getElementById(
            'btn-draw-question'
        ).disabled =
            true;

        return;

    }


    const question =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    gameState
        .drawnQuestions
        .push(
            question
        );


    gameState.currentQuestion =
        question;


    document.getElementById(
        'question-text'
    ).innerText =
        question.q;


    const answer =
        document.getElementById(
            'answer-text'
        );


    answer.innerText =
        question.a;


    answer.style.display =
        'none';


    document.getElementById(
        'btn-reveal'
    ).disabled =
        false;

}



/* =====================================================
   REVEAL ANSWER
===================================================== */

function revealAnswer() {

    if (
        !gameState.currentQuestion
    ) {

        return;

    }


    const answer =
        document.getElementById(
            'answer-text'
        );


    answer.style.display =
        'block';


    document.getElementById(
        'btn-reveal'
    ).disabled =
        true;

}



/* =====================================================
   WIN MODAL
===================================================== */

function showWin(
    teamName
) {

    document.getElementById(
        'win-title'
    ).innerText =
        `مبروك لـ ${teamName}!`;


    document.getElementById(
        'win-message'
    ).innerText =
        'أكمل الفريق خط بنقو بنجاح 🎉';


    document.getElementById(
        'win-modal'
    ).classList.add(
        'show'
    );

}



function closeWinModal() {

    document.getElementById(
        'win-modal'
    ).classList.remove(
        'show'
    );

}



/* =====================================================
   START
===================================================== */

window.addEventListener(
    'DOMContentLoaded',
    () => {

        renderTeamBoards();

    }
);
